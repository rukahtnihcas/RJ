name: Ripple recogniser benchmark

# Compares candidate on-device vision models on real photos (COCO 2017 validation crops).
on:
  workflow_dispatch:
  push:
    paths:
      - "ripple/tools/**"
      - "ripple/core/src/main/resources/vocab.tsv"
      - ".github/workflows/ripple-recognizer-eval.yml"

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q huggingface_hub
      - run: python ripple/tools/recognizer.py discover

  eval:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { repo: Xenova/clip-vit-base-patch32, variant: fp32 }
          - { repo: Xenova/clip-vit-base-patch16, variant: fp32 }
          - { repo: Xenova/clip-vit-large-patch14, variant: fp32 }
          - { repo: Xenova/clip-vit-large-patch14, variant: quantized }
          - { repo: Xenova/siglip-base-patch16-224, variant: fp32 }
          - { repo: Xenova/siglip-large-patch16-384, variant: fp32 }
          - { repo: onnx-community/siglip2-base-patch16-224-ONNX, variant: fp32 }
          - { repo: onnx-community/siglip2-large-patch16-256-ONNX, variant: fp32 }
          - { repo: onnx-community/siglip2-large-patch16-256-ONNX, variant: quantized }
          - { repo: onnx-community/siglip2-so400m-patch14-224-ONNX, variant: fp32 }
          - { repo: Xenova/mobileclip_blt, variant: fp32 }
          - { repo: Xenova/mobileclip_s2, variant: fp32 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q huggingface_hub onnxruntime tokenizers numpy pillow
      - name: COCO 2017 validation images
        run: |
          mkdir -p coco && cd coco
          curl -sSLO http://images.cocodataset.org/zips/val2017.zip
          curl -sSLO http://images.cocodataset.org/annotations/annotations_trainval2017.zip
          unzip -q val2017.zip && unzip -q annotations_trainval2017.zip annotations/instances_val2017.json
          rm *.zip
      - run: python ripple/tools/recognizer.py eval --repo "${{ matrix.repo }}" --variant "${{ matrix.variant }}" --coco coco
