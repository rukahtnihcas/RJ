name: Ripple

on:
  push:
    paths:
      - "ripple/**"
      - ".github/workflows/ripple.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ripple
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Test scoring engine
        run: ./gradlew :core:test --console=plain
      - name: Build APK
        run: ./gradlew :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: ripple-debug-apk
          path: ripple/app/build/outputs/apk/debug/app-debug.apk
