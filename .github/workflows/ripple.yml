name: Ripple

on:
  push:
    paths:
      - "ripple/**"
      - ".github/workflows/ripple.yml"
  workflow_dispatch:

permissions:
  contents: write

# The on-device recogniser bundled into the app. Chosen with the "Ripple recogniser benchmark" workflow.
env:
  RECOGNIZER_REPO: Xenova/clip-vit-base-patch32
  RECOGNIZER_REVISION: main
  RECOGNIZER_VARIANT: fp32

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ripple
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Build the on-device recogniser into the app
        run: |
          pip install -q huggingface_hub onnxruntime tokenizers numpy pillow
          python tools/recognizer.py build --repo "$RECOGNIZER_REPO" --revision "$RECOGNIZER_REVISION" \
            --variant "$RECOGNIZER_VARIANT" --out app/src/main/assets/recognizer
          ls -la app/src/main/assets/recognizer
      - name: Test scoring engine
        run: ./gradlew :core:test --console=plain
      - name: Build APK
        run: ./gradlew :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: ripple-debug-apk
          path: ripple/app/build/outputs/apk/debug/app-debug.apk
      # A fixed download link for phones: the newest build always replaces the previous one.
      - name: Publish APK as a pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Ripple.apk
          gh release delete ripple-latest --cleanup-tag --yes || true
          gh release create ripple-latest Ripple.apk --prerelease --target "$GITHUB_SHA" \
            --title "Ripple (latest test build)" \
            --notes "Automatic test build. Download Ripple.apk on an Android 8+ phone and open it to install."
