name: ProCam
on:
  push:
    paths:
      - 'procamera/**'
      - '.github/workflows/procam.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: procamera
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test the image pipeline
        run: ./gradlew :imaging:test --no-daemon

      - name: Build the APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: procam-debug-apk
          path: procamera/app/build/outputs/apk/debug/app-debug.apk
